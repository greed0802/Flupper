name: Verify

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install declared dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt

      - name: Scan tracked files for credentials and real tunnel hosts
        run: python tools/verify_tracked_hygiene.py

      - name: Collect from repository root
        run: python -m pytest --collect-only -q backend/tests

      - name: Test from repository root
        run: python -m pytest backend/tests -ra --tb=short

      - name: Collect from backend
        working-directory: backend
        run: python -m pytest --collect-only -q tests

      - name: Test from backend
        working-directory: backend
        run: python -m pytest tests -ra --tb=short
