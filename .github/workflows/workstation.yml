name: Workstation

# The Flutter client is a second implementation of the gateway contract, so it
# is verified on its own terms. Every command below is one that was run locally
# against the pinned SDK; nothing here is aspirational.
#
# The version is pinned exactly, not by range: a Flutter upgrade changes the
# analyser's lint set and the widget test binding, and "it passed on a newer
# SDK" is not the same claim as "it passes on the SDK the workstation is built
# with".
#
# 3.47.2 is the pin because it is the SDK the recorded results came from. The
# approved plan named 3.24.1, which is not installed anywhere this project has
# been built or tested; see workstation/README.md, "Toolchain". Do not lower this
# pin without running the suite on the lower version first.
#
# The Chrome step runs one test file at a time rather than the whole suite in a
# single invocation. A bulk `flutter test --platform chrome` run loses the
# browser connection partway through in this project's environment, while each
# file passes on its own, so the per-file loop is the form that actually
# completes. It is still unverified here: no runner with a Chrome executable has
# executed it yet. Treat its result as unverified until one does.

on:
  push:
  pull_request:

jobs:
  workstation:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Report the toolchain
        run: flutter --version

      - name: Enable web
        run: flutter config --enable-web

      - name: Resolve dependencies
        working-directory: workstation
        run: flutter pub get

      - name: Analyze
        working-directory: workstation
        run: flutter analyze --fatal-infos

      - name: Test (Dart VM and widget tests)
        working-directory: workstation
        run: flutter test

      - name: Test (web platform, Chrome, per-file)
        working-directory: workstation
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "--- Chrome: ${file} ---"
            flutter test --platform chrome "${file}"
          done < <(find test -type f -name '*_test.dart' -print0)

      - name: Build web
        working-directory: workstation
        run: flutter build web
